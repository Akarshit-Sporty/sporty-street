name: sporty-street
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportystreet}
      POSTGRES_USER: ${POSTGRES_USER:-sportystreet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportystreet-demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sportystreet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sportystreet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sportystreet-demo}
      SPORTY_PROVIDER_TOKEN: ${PROVIDER_TOKEN:-local-demo-provider-token}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
volumes:
  postgres-data:
